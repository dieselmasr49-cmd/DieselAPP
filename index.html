<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <!-- ✅ PWA Meta Tags -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">

<!-- ✅ Service Worker Registration -->
<script>
  // ✅ تسجيل Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((registration) => {
          console.log('✅ Service Worker registered:', registration);
        })
        .catch((error) => {
          console.log('❌ Service Worker registration failed:', error);
        });
    });
  }

  // ✅ ✅ ✅ زر التثبيت (نسخة بسيطة)
  let deferredPrompt = null;
  const installBanner = document.getElementById('installBanner');
  const installBtn = document.getElementById('installAppBtn');
  const closeBanner = document.getElementById('closeInstallBanner');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBanner) {
      installBanner.style.display = 'flex';
    }
    console.log('📱 PWA install prompt available');
  });

  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const result = await deferredPrompt.userChoice;
        console.log('📱 User choice:', result.outcome);
        if (result.outcome === 'accepted') {
          if (typeof window.showToast === 'function') {
            window.showToast('✅ تم التثبيت', 'تم إضافة التطبيق لشاشة هاتفك', 'success');
          }
        }
        deferredPrompt = null;
        if (installBanner) {
          installBanner.style.display = 'none';
        }
      } else {
        // ✅ لو مفيش prompt، نفتح صفحة التثبيت اليدوي
        alert('📱 لتثبيت التطبيق:\n1. اضغط على زر القائمة (⋮)\n2. اختر "تثبيت التطبيق" أو "Add to Home Screen"');
      }
    });
  }

  if (closeBanner) {
    closeBanner.addEventListener('click', () => {
      if (installBanner) {
        installBanner.style.display = 'none';
      }
    });
  }

  window.addEventListener('appinstalled', () => {
    console.log('📱 App installed successfully!');
    if (typeof window.showToast === 'function') {
      window.showToast('🎉 شكراً للتثبيت', 'تم تثبيت التطبيق بنجاح', 'success');
    }
  });
</script>
<style>
    /* ✅ PWA Install Banner */
    #installBanner {
      display: none;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      margin: 10px 15px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      animation: slideDown 0.5s ease;
      position: sticky;
      top: 0;
      z-index: 999;
    }
  
    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  
    #installBanner strong {
      font-size: 1rem;
    }
  
    #installBanner p {
      margin: 0;
      font-size: 0.8rem;
      opacity: 0.9;
    }
  
    #installAppBtn {
      background: white;
      color: #3b82f6;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Cairo', sans-serif;
    }
  
    #installAppBtn:hover {
      transform: scale(1.05);
    }
  
    #closeInstallBanner {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }
  </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MappMaster - النظام الرئيسي</title>

    <!-- ✅ CSS الأساسي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="css/shared.css">

    <style>
        /* ✅ ستايل شاشة التحميل */
        #app-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 99999;
            transition: opacity 0.5s ease;
            font-family: 'Cairo', sans-serif;
            color: white;
        }
        #app-loader .loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #app-loader .loader-text {
            margin-top: 20px;
            font-size: 1rem;
            color: #94a3b8;
        }

        /* ✅ IFrame ستايل */
        #app-iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }
    </style>
</head>
<body>

    <!-- ✅ شاشة التحميل -->
    <div id="app-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">⏳ جاري تحميل النظام...</div>
    </div>

    <!-- ✅ الـ IFrame اللي هيعرض الصفحات -->
    <iframe id="app-iframe"></iframe>

    <!-- ✅ JS -->
    <script type="module">
        // ==========================================
        // 🚀 ملف التوجيه الرئيسي (Router)
        // ==========================================

        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabaseUrl = 'https://khjoskyotujvkeupmkdm.supabase.co/';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtoam9za3lvdHVqdmtldXBta2RtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTIwNTAsImV4cCI6MjA5NDcyODA1MH0.rlXmRxTUnecci1__J8zsvHou5-pXzFaLJc_M3P_9sPQ';
        const supabase = createClient(supabaseUrl, supabaseKey);
        window.supabase = supabase;

        const iframe = document.getElementById('app-iframe');
        const loader = document.getElementById('app-loader');

        // ✅ دوال مشتركة
        window.showToast = function(title, message, type = 'success') {
            // ... (نفس الكود بتاع الـ Toast)
            let container = document.querySelector('.toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            const bgColors = { success: '#10b981', warning: '#f59e0b', error: '#ef4444', info: '#3b82f6' };
            const toast = document.createElement('div');
            toast.className = 'toast-card';
            toast.style.background = bgColors[type] || '#3b82f6';
            toast.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 4px;">${title}</div>
                <div style="font-size: 0.9rem; opacity: 0.9;">${message}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        // ✅ دالة التنقل بين الصفحات
        function navigateTo(page) {
            iframe.style.display = 'block';
            iframe.src = `pages/${page}`;
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        }

        // ✅ التحقق من الجلسة وتوجيه المستخدم
        async function checkSessionAndRoute() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error) throw error;

                if (session) {
                    // ✅ جلب دور المستخدم
                    const { data: stationData } = await supabase
                        .from('stations')
                        .select('role')
                        .eq('user_id', session.user.id)
                        .maybeSingle();

                    const role = stationData?.role || 'user';
                    
                    // ✅ حفظ البيانات في localStorage
                    localStorage.setItem('loggedInUserId', session.user.id);
                    localStorage.setItem('loggedInUserEmail', session.user.email);
                    
                    // ✅ التوجيه حسب الصلاحية
                    if (role === 'adminmaster') {
                        navigateTo('admin.html');
                    } else {
                        navigateTo('dashboard.html');
                    }
                } else {
                    // ✅ لو مفيش جلسة → صفحة تسجيل الدخول
                    navigateTo('login.html');
                }

            } catch (error) {
                console.error('❌ خطأ في التحقق من الجلسة:', error.message);
                navigateTo('login.html');
            }
        }

        // ✅ تشغيل التوجيه
        checkSessionAndRoute();

        // ✅ الاستماع لتسجيل الخروج من الصفحات الفرعية
        window.addEventListener('message', (event) => {
            if (event.data === 'logout') {
                localStorage.clear();
                navigateTo('login.html');
            }
        });

        // ✅ تحديث الجلسة بعد تسجيل الدخول
        window.addEventListener('message', (event) => {
            if (event.data === 'login_success') {
                checkSessionAndRoute();
            }
        });

        console.log('🚀 Router loaded');
    </script>

</body>
</html>
