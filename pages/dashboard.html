<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - MappMaster</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    
    <!-- ✅ Navigation Bar -->
    <footer class="bottom-nav">
        <div class="bottom-nav-container">
            <a href="dashboard.html" class="bottom-nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>الرئيسية</span>
            </a>
            <a href="blacklist.html" class="bottom-nav-item">
                <i class="fa-solid fa-person-circle-xmark"></i>
                <span>إضافة حالة</span>
            </a>
            <a href="search.html" class="bottom-nav-item">
                <i class="fa-solid fa-magnifying-glass"></i>       
                <span>بحث</span>
            </a>
            <a href="reports.html" class="bottom-nav-item">
                <i class="fa-solid fa-chart-simple"></i>
                <span>التقارير</span>
            </a>
            <a href="chat-list.html" class="bottom-nav-item" id="chatNavBtn">
                <i class="fa-regular fa-comment-dots"></i>
                <span>الرسائل</span>
                <span id="chatNavBadge" class="chat-nav-badge" style="display: none;">0</span>
            </a>
            <a href="settings.html" class="bottom-nav-item">
                <i class="fa-solid fa-gear"></i>
                <span>الإعدادات</span>
            </a>
            <button id="logoutBtn" class="bottom-nav-item logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>خروج</span>
            </button>
        </div>
    </footer>

    <!-- ✅ المحتوى -->
    <main class="dashboard-main">
        
        <!-- ✅ ✅ ✅ أيقونة الرسائل (فوق على الشمال) -->
        <div class="messages-header">
            <div class="messages-icon-container">
                <button id="messagesToggleBtn" class="messages-toggle-btn" title="الرسائل">
                    <i class="fa-regular fa-envelope"></i>
                    <span id="unreadBadge" class="unread-badge" style="display: none;">0</span>
                </button>
            </div>
        </div>

        <div class="dashboard-welcome">
            <div>
                <h4>أهلاً بك، <span id="currentUserName">جاري التحميل...</span> 👋</h4>
                <p>متابعة فورية لإحصائيات الحالات والمحطات المسجلة في النظام</p>
            </div>
        </div>

        <!-- ✅ إحصائيات -->
        <div class="stats-grid">
            <div class="stat-card total-cases">
                <div class="stat-icon">🚫</div>
                <div class="stat-info">
                    <h3 id="totalEmployeesCount">--</h3>
                    <p>إجمالي المحظورين</p>
                </div>
            </div>
            <div class="stat-card active-stations">
                <div class="stat-icon">📍</div>
                <div class="stat-info">
                    <h3 id="totalStationsCount">--</h3>
                    <p>المحطات المسجلة</p>
                </div>
            </div>
        </div>

        <!-- ✅ آخر الحالات -->
        <div class="dashboard-content">
            <div class="content-box">
                <div class="box-header">
                    <h4>🚨 آخر الحالات المدرجة</h4>
                </div>
                <div id="recentEmployeesList" class="recent-list">
                    <div class="loading-placeholder">جاري تحميل البيانات...</div>
                </div>
            </div>
        </div>
        
    </main>

    <!-- ========================================== -->
    <!-- 📋 نافذة تفاصيل الموظف -->
    <!-- ========================================== -->
    <div id="detailsDialog" class="dialog-overlay hidden">
        <div class="dialog-card animate-slide">
            <div class="dialog-header">
                <h3>📋 تفاصيل الموظف</h3>
                <button id="closeDetailsBtn" class="close-dialog-btn">&times;</button>
            </div>
            <div class="dialog-body">
                <div id="dialogDetailsBody"></div>
                <div class="dialog-footer-actions">
                    <button id="backDetailsBtn" class="btn btn-secondary">↩️ رجوع</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 💬 نافذة الرسائل -->
    <!-- ========================================== -->
    <div id="messagesDialog" class="dialog-overlay hidden">
        <div class="dialog-card animate-slide" style="max-width: 500px;">
            <div class="dialog-header" style="background: #3b82f6;">
                <h3 style="color: white;">💬 الرسائل</h3>
                <button id="closeMessagesBtn" class="close-dialog-btn" style="color: white;">&times;</button>
            </div>
            <div class="dialog-body" style="padding: 0;">
                <div id="messagesList" style="max-height: 400px; overflow-y: auto; padding: 10px;">
                    <div class="loading-placeholder">جاري تحميل الرسائل...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ JS -->
    <script type="module" src="../js/shared.js"></script>
    <script type="module" src="../js/session-tracker.js"></script>
    <script type="module" src="../js/realtime-handler.js"></script>
    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
