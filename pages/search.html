<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحث الذكي - MappMaster</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/search.css">
</head>
<body>

     <!-- ✅ Navigation Bar -->
     <footer class="bottom-nav">
        <div class="bottom-nav-container">
            <a href="dashboard.html" class="bottom-nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>الرئيسية</span>
            </a>
            <a href="blacklist.html" class="bottom-nav-item">
                <i class="fa-solid fa-person-circle-xmark"></i>
                <span>إضافة حالة</span>
            </a>
            <a href="search.html" class="bottom-nav-item">
                <i class="fa-solid fa-magnifying-glass"></i>       
              <span>بحث</span>
            </a>
            <a href="reports.html" class="bottom-nav-item">
                <i class="fa-solid fa-chart-simple"></i>
                <span>التقارير</span>
            </a>
           
            <a href="settings.html" class="bottom-nav-item">
                <i class="fa-solid fa-gear"></i>
                <span>الإعدادات</span>
            </a>

            <button id="logoutBtn" class="bottom-nav-item logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>خروج</span>
            </button>
        </div>
        
    </footer>

    <!-- ✅ المحتوى -->
    <main class="search-main">
        <div class="search-container">

            <!-- ✅ هيدر البحث -->
            <div class="search-header">
                <h2><i class="fa-solid fa-magnifying-glass" style="color: #3b82f6;"></i> البحث الذكي</h2>
                <p>ابحث في جميع حالات البلاك ليست بسرعة ودقة</p>
            </div>

            <!-- ✅ شريط البحث -->
            <div class="search-bar-wrapper">
                <div class="search-input-group">
                    <i class="fa-solid fa-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="ابحث بالاسم أو الرقم القومي..." autofocus>
                    <button id="clearSearchBtn" class="clear-btn" style="display: none;">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <button id="searchBtn" class="btn btn-primary">
                    <i class="fa-solid fa-magnifying-glass"></i> بحث
                </button>
            </div>

            <!-- ✅ فلتر متقدم -->
            <div class="filter-section">
                <div class="filter-row">
                    <div class="filter-group">
                        <label><i class="fa-solid fa-building"></i> المحطة</label>
                        <select id="filterStation">
                            <option value="">جميع المحطات</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><i class="fa-solid fa-calendar"></i> من تاريخ</label>
                        <input type="date" id="filterDateFrom">
                    </div>
                    <div class="filter-group">
                        <label><i class="fa-solid fa-calendar"></i> إلى تاريخ</label>
                        <input type="date" id="filterDateTo">
                    </div>
                    <div class="filter-group">
                        <label><i class="fa-solid fa-tag"></i> السبب</label>
                        <select id="filterReason">
                            <option value="">جميع الأسباب</option>
                            <option value="سرقة">سرقة</option>
                            <option value="عجز">عجز</option>
                            <option value="تزوير">تزوير</option>
                            <option value="تلاعب">تلاعب</option>
                            <option value="أخرى">أخرى</option>
                        </select>
                    </div>
                </div>
                <div class="filter-actions">
                    <button id="applyFilterBtn" class="btn btn-primary btn-sm">
                        <i class="fa-solid fa-filter"></i> تطبيق الفلتر
                    </button>
                    <button id="resetFilterBtn" class="btn btn-secondary btn-sm">
                        <i class="fa-solid fa-undo"></i> إعادة تعيين
                    </button>
                </div>
            </div>

            <!-- ✅ إحصائيات البحث -->
            <div class="search-stats" id="searchStats" style="display: none;">
                <span id="resultsCount">0</span> نتيجة
                <span id="searchTime">0.0</span> ثانية
            </div>

            <!-- ✅ نتائج البحث -->
            <div id="searchResults" class="search-results">
                <div class="empty-state">
                    <i class="fa-solid fa-search" style="font-size: 3rem; color: #cbd5e1;"></i>
                    <h4>ابحث عن موظف</h4>
                    <p>اكتب اسم أو رقم قومي في شريط البحث للبدء</p>
                </div>
            </div>

        </div>

<!-- ========================================== -->
<!-- 📋 نافذة تفاصيل الموظف -->
<!-- ========================================== -->
<div id="detailsDialog" class="dialog-overlay hidden">
    <div class="dialog-card animate-slide">
        <div class="dialog-header">
            <h3>📋 تفاصيل الموظف</h3>
            <button id="closeDetailsBtn" class="close-dialog-btn">&times;</button>
        </div>
        <div class="dialog-body">
            <div id="dialogDetailsBody"></div>
            <div class="dialog-footer-actions">
                <button id="backDetailsBtn" class="btn btn-secondary">↩️ رجوع</button>
            </div>
        </div>
    </div>
</div>
    </main>

    <!-- ✅ JS -->
    <script type="module" src="../js/shared.js"></script>
    <script type="module" src="../js/session-tracker.js"></script>
    <script type="module" src="../js/search.js"></script>
</body>
</html>
