<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقارير - MappMaster</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/reports.css">
</head>
<body>

      <!-- ✅ Navigation Bar -->
      <footer class="bottom-nav">
        <div class="bottom-nav-container">
            <a href="dashboard.html" class="bottom-nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>الرئيسية</span>
            </a>
            <a href="blacklist.html" class="bottom-nav-item">
                <i class="fa-solid fa-person-circle-xmark"></i>
                <span>إضافة حالة</span>
            </a>
            <a href="search.html" class="bottom-nav-item">
                <i class="fa-solid fa-magnifying-glass"></i>       
              <span>بحث</span>
            </a>
            <a href="reports.html" class="bottom-nav-item">
                <i class="fa-solid fa-chart-simple"></i>
                <span>التقارير</span>
            </a>
           
            <a href="settings.html" class="bottom-nav-item">
                <i class="fa-solid fa-gear"></i>
                <span>الإعدادات</span>
            </a>

            <button id="logoutBtn" class="bottom-nav-item logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>خروج</span>
            </button>
        </div>
        
    </footer>

    <!-- ✅ المحتوى -->
    <main class="reports-main">
        <div class="reports-container">

            <!-- ✅ هيدر -->
            <div class="reports-header">
                <h2><i class="fa-solid fa-file-export" style="color: #3b82f6;"></i> التقارير والتصدير</h2>
                <p>قم بتصدير تقارير النظام بصيغ متعددة</p>
            </div>

            <!-- ✅ الإحصائيات السريعة -->
            <div class="stats-mini-grid">
                <div class="stat-mini-card">
                    <span class="stat-mini-label">📊 إجمالي المحطات</span>
                    <div class="stat-mini-number" id="reportTotalStations">--</div>
                </div>
                <div class="stat-mini-card">
                    <span class="stat-mini-label">🚫 إجمالي المحظورين</span>
                    <div class="stat-mini-number" id="reportTotalEmployees">--</div>
                </div>
                <div class="stat-mini-card">
                    <span class="stat-mini-label">🕐 آخر تحديث</span>
                    <div class="stat-mini-number" id="reportLastUpdate" style="font-size: 0.9rem;">--</div>
                </div>
            </div>

       <!-- ✅ أزرار التصدير -->
<div class="export-grid">
    <button onclick="exportCSV()" class="export-btn export-csv">
        <i class="fa-solid fa-file-excel"></i> Excel (CSV)
        <span class="export-desc">تصدير جميع البيانات</span>
    </button>
    <button onclick="exportPDF()" class="export-btn export-pdf">
        <i class="fa-solid fa-file-pdf"></i> PDF
        <span class="export-desc">تقرير رسمي شامل</span>
    </button>
</div>

            <!-- ✅ تقرير نشاط الحسابات -->
        
<div class="personal-report-section">
    <div class="section-header">
        <h3><i class="fa-solid fa-chart-line" style="color: #3b82f6;"></i> 📊 تقرير نشاطي الشخصي</h3>
        <button onclick="loadPersonalReport()" class="btn btn-primary btn-sm">
            <i class="fa-solid fa-arrows-rotate"></i> تحديث
        </button>
    </div>

    <!-- ✅ مؤشرات النشر -->
    <div class="personal-stats-grid">
        <div class="personal-stat-card">
            <span class="personal-stat-label">📊 إجمالي ما نشرته</span>
            <div class="personal-stat-number" id="myTotalCases">0</div>
        </div>
        <div class="personal-stat-card">
            <span class="personal-stat-label">📈 معدل النشر</span>
            <div class="personal-stat-number" id="myPublishRate">0%</div>
        </div>
        <div class="personal-stat-card">
            <span class="personal-stat-label">🏆 ترتيبك بين الناشرين</span>
            <div class="personal-stat-number" id="myRank">--</div>
        </div>
    </div>

    <!-- ✅ رسم بياني -->
    <div class="chart-container">
        <canvas id="myPublishChart" height="200"></canvas>
    </div>

    <!-- ✅ قائمة حالاتي -->
    <div class="my-cases-section">
        <h4><i class="fa-solid fa-list"></i> الحالات التي نشرتها</h4>
        <div id="myCasesList">
            <div class="loading-placeholder">جاري تحميل حالاتك...</div>
        </div>
    </div>
</div>

        </div>
    </main>

    <!-- ✅ JS -->
    <script type="module" src="../js/shared.js"></script>
    <script type="module" src="../js/session-tracker.js"></script>
    <script type="module" src="../js/reports.js"></script>
</body>
</html>
